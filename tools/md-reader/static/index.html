<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('md_reader_theme')||'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i></i>MD Reader</div>
    <label class="add-btn btn primary sm">
      + Add files
      <input id="fileInput" type="file" accept=".md,.markdown,.txt" multiple hidden>
    </label>
    <div id="fileList" class="file-list"></div>
    <div style="margin-top:auto"></div>
    <div class="appear" id="appear">
      <button data-v="dark">Dark</button>
      <button data-v="light">Light</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div id="currentName" class="current-name">Select a file</div>
      <div class="actions">
        <label class="pill accent" style="cursor:pointer"><input type="checkbox" id="exportAll"> export all, in order</label>
        <button class="btn sm" id="exportDocx">Export Word</button>
        <button class="btn primary sm" id="exportPdf">Export PDF</button>
      </div>
    </div>
    <div class="reader" id="reader">
      <div class="empty">Add one or more .md files on the left to start reading.<br>Nothing here ever leaves this machine.</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
